name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (tsc + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint

  edge-functions:
    name: Edge functions de pago y media (check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Los tests de firma no importan nada de la red: corren solos.
      - name: Tests de la firma de MercadoPago
        run: deno test supabase/functions/_shared/mp-signature.test.ts
      # El check arrancó acotado a las funciones de pago, que son las que tocan
      # plata. Sumar el resto es bienvenido, pero cada una que entre tiene que
      # pasar primero. Las de media entraron con la mudanza a R2: firman
      # subidas y borran archivos, así que un error de tipos ahí se paga en
      # assets perdidos.
      - name: Type-check de las funciones de pago
        run: |
          deno check \
            supabase/functions/_shared/mp-signature.ts \
            supabase/functions/_shared/mp-oauth.ts \
            supabase/functions/mp-webhook/index.ts \
            supabase/functions/mp-gym-webhook/index.ts \
            supabase/functions/crear-cobro-socio/index.ts
      - name: Type-check de las funciones de media
        run: |
          deno check \
            supabase/functions/_shared/r2.ts \
            supabase/functions/sign-video-upload/index.ts \
            supabase/functions/sync-media-webhook/index.ts \
            supabase/functions/cleanUp-media/index.ts

  mobile:
    name: Mobile (sintaxis + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Los .js de core y de la app mobile no tienen build: chequeo de sintaxis.
      - name: Sintaxis de packages/core
        run: for f in packages/core/src/*.js packages/core/src/hooks/**/*.js; do node --check "$f"; done
        shell: bash
      - name: Tests del motor de sync
        run: npm --workspace gymtrack run test
